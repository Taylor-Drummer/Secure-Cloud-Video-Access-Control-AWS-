<!DOCTYPE html>
<html>
<head><title>Verifying access...</title></head>
<body style="font-family: sans-serif; text-align: center; margin-top: 100px;">
  <h2 id="status">Verifying access...</h2>
  <script>
    function getTokenPayload(idToken) {
      const payload = idToken.split('.')[1];
      const decoded = decodeURIComponent(atob(payload.replace(/-/g, '+').replace(/_/g, '/'))
        .split('').map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
      return JSON.parse(decoded);
    }

    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const idToken = params.get('id_token');

    if (!idToken) {
      document.getElementById('status').innerText = 'Login failed, no token received.';
    } else {
      const claims = getTokenPayload(idToken);
      const username = claims.email;

      fetch('https://XXXXXXXXXX.execute-api.us-east-1.amazonaws.com/?username=' + encodeURIComponent(username))
        .then(res => res.json())
        .then(data => {
          if (data.result === 'GRANTED') {
            document.cookie = 'CloudFront-Policy=' + data.cookies['CloudFront-Policy'] + '; path=/; secure';
            document.cookie = 'CloudFront-Signature=' + data.cookies['CloudFront-Signature'] + '; path=/; secure';
            document.cookie = 'CloudFront-Key-Pair-Id=' + data.cookies['CloudFront-Key-Pair-Id'] + '; path=/; secure';
            window.location.href = data.video_url;
          } else {
            document.getElementById('status').innerText = 'Access Denied: ' + username + ' is not authorized to view this video.';
          }
        })
        .catch(err => {
          document.getElementById('status').innerText = 'Error verifying access.';
        });
    }
  </script>
</body>
</html>
